name: Manual update Product Formula in Tap
# In the case of automation failure, this workflow allows a user to manually run a product version update.
# Note for casks - the templater automatically adds "hashicorp-" as a prefix, so only use product name.
on:
    workflow_dispatch:
      inputs:
        product:
          description: product name as it appears in binary (ie. "vault", "vault-enterprise", etc.)
          required: true
        version:
          description: semantic version string (ie. "1.12.2")
          required: true
        is_cask:
          type: boolean
          description: check if updating a cask (rather than a tap formula)
          default: false

jobs:
  update-formula:
    name: Update Formula
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          # token under hc-github-team-es-release-engineering user
          ref: main
          token: ${{ secrets.HOMEBREW_TAP_UPDATER_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c #v6.4.0
        with:
          go-version-file: "util/formula_templater/go.mod"

      - name: Build formula_templater CLI
        run: |
          cd util/formula_templater && go build

      - name: Generate new formula
        if: ${{ github.event.inputs.is_cask == 'false' }}
        run: |
          ./util/formula_templater/formula_templater \
            ${{github.event.inputs.product}} \
            ${{github.event.inputs.version}} \
            ./util/formula_templater/config.hcl > ./Formula/${{github.event.inputs.product}}.rb

      - name: Generate new cask
        if: ${{ github.event.inputs.is_cask == 'true' }}
        run: |
          ./util/formula_templater/formula_templater \
            -cask \
            ${{github.event.inputs.product}} \
            ${{github.event.inputs.version}} \
            ./util/formula_templater/config.hcl > ./Casks/hashicorp-${{github.event.inputs.product}}.rb

      - name: Publish Change
        env:
          PRODUCT: ${{ github.event.inputs.product }}
          VERSION: ${{ github.event.inputs.version }}
          IS_CASK: ${{ github.event.inputs.is_cask }}
        run: |
          git config user.name hc-github-team-es-release-engineering
          git config user.email github-team-es-release-engineering@hashicorp.com

          # Stage only the file that was generated — avoids glob expansion errors
          # when the other directory has no matching changes.
          if [[ "$IS_CASK" == "true" ]]; then
            git add "Casks/hashicorp-${PRODUCT}.rb"
          else
            git add "Formula/${PRODUCT}.rb"
          fi

          # Exit early if the generated file is identical to what is already
          # committed (e.g. re-running for a version that is already current).
          if git diff --staged --quiet; then
            echo "::notice::Generated file is unchanged — nothing to commit for ${PRODUCT} ${VERSION}."
            exit 0
          fi

          git commit -m "Bump ${PRODUCT} to ${VERSION}"

          # Rebase onto any updates published since checkout before pushing.
          git pull --rebase origin main

          # The service user is allowed to bypass the pull request requirement.
          git push origin HEAD:main
